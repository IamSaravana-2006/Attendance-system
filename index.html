<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AVCE Attendance — Staff Login</title>
  <meta name="description" content="Staff and Admin login for AVCE Attendance Management System">
  <meta name="theme-color" content="#0D1444">
  <link rel="stylesheet" href="static/style.css">
</head>
<body class="login-page">

  <!-- ── HERO ── -->
  <div class="login-hero">
    <div class="login-hero-art">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="90" fill="rgba(79,110,247,0.10)" class="pulse-circle"/>
        <g class="orbit-ring">
          <circle cx="100" cy="100" r="68" stroke="rgba(79,110,247,0.18)" stroke-width="1.5" stroke-dasharray="6 4"/>
          <circle cx="168" cy="100" r="5" fill="#4F6EF7" opacity="0.8"/>
        </g>
        <g class="orbit-ring-2">
          <circle cx="100" cy="100" r="50" stroke="rgba(124,92,252,0.18)" stroke-width="1.5" stroke-dasharray="4 6"/>
          <circle cx="100" cy="50" r="4" fill="#7C5CFC" opacity="0.7"/>
        </g>
        <g transform="translate(72,68)">
          <ellipse cx="28" cy="28" rx="28" ry="10" fill="#4F6EF7" opacity="0.9"/>
          <rect x="8" y="16" width="40" height="12" rx="4" fill="#4F6EF7"/>
          <line x1="50" y1="22" x2="56" y2="36" stroke="#FFA621" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="56" cy="38" r="3" fill="#FFA621"/>
          <path d="M58 8 L60 4 L62 8 L66 10 L62 12 L60 16 L58 12 L54 10Z" fill="#FFA621" opacity="0.8" style="animation:floatDot 2.5s ease-in-out infinite;"/>
        </g>
        <g transform="translate(34,118)">
          <rect x="0"  y="32" width="14" height="18" rx="3" fill="#16C784" opacity="0.85" style="animation:floatDot 3s ease-in-out infinite 0.2s;"/>
          <rect x="18" y="20" width="14" height="30" rx="3" fill="#4F6EF7" opacity="0.85" style="animation:floatDot 3s ease-in-out infinite 0.5s;"/>
          <rect x="36" y="10" width="14" height="40" rx="3" fill="#7C5CFC" opacity="0.85" style="animation:floatDot 3s ease-in-out infinite 0.8s;"/>
          <rect x="54" y="24" width="14" height="26" rx="3" fill="#FFA621" opacity="0.85" style="animation:floatDot 3s ease-in-out infinite 1s;"/>
          <line x1="-4" y1="52" x2="72" y2="52" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
        </g>
        <circle cx="28"  cy="72"  r="4" fill="#16C784" opacity="0.6" class="float-dot"/>
        <circle cx="172" cy="142" r="5" fill="#FFA621"  opacity="0.5" class="float-dot"/>
        <circle cx="158" cy="58"  r="3" fill="#7C5CFC"  opacity="0.6" class="float-dot"/>
        <g transform="translate(142,42)">
          <circle cx="18" cy="18" r="18" fill="#16C784" opacity="0.15"/>
          <circle cx="18" cy="18" r="12" fill="#16C784" opacity="0.9"/>
          <polyline points="12,18 16,22 24,14" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" class="check-draw"/>
        </g>
      </svg>
    </div>
    <h1 class="login-hero-title">AVCE Attendance</h1>
    <p class="login-hero-sub">Annai Vailankanni College of Engineering</p>
  </div>

  <!-- ── LOGIN SHEET ── -->
  <div class="login-sheet">
    <h2>Staff Login</h2>
    <p>Sign in to manage attendance</p>

    <form id="loginForm" autocomplete="on" novalidate>
      <div class="login-field">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="username" placeholder="Username" required autocomplete="username" autocapitalize="none">
      </div>
      <div class="login-field">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
      <p id="loginMessage" class="login-msg" aria-live="polite"></p>
    </form>

    <div class="login-footer">
      &copy; 2026 AVCE &bull; Developed by <strong>Saravanan K</strong>
    </div>
  </div>

  <script src="static/app.js"></script>
  <script>
    // GitHub Pages: override redirect paths to .html files
    const _origRequireLogin = AVCE.requireLogin;
    function ghPagesLogin() {
      const sess = AVCE.getSession();
      if (!sess) { window.location.href = 'index.html'; return null; }
      return sess;
    }

    // GitHub Pages login: use localStorage only (no Flask API)
    document.addEventListener('DOMContentLoaded', function() {
      AVCE.initTheme();
      if (AVCE.getSession()) { window.location.href = 'dashboard.html'; return; }

      const form = document.getElementById('loginForm');
      if (!form) return;
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const msg = document.getElementById('loginMessage');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) { if(msg) msg.textContent='Enter username and password.'; return; }
        if (btn) { btn.textContent = 'Signing in…'; btn.disabled = true; }
        setTimeout(function() {
          const sess = AVCE.login(username, password);
          if (sess) {
            if (msg) { msg.style.color='var(--success)'; msg.textContent='✓ Welcome back!'; }
            setTimeout(function() { window.location.href = 'dashboard.html'; }, 500);
          } else {
            if (msg) { msg.style.color='var(--danger)'; msg.textContent='Invalid username or password.'; }
            if (btn) { btn.textContent='Sign In'; btn.disabled=false; }
          }
        }, 400);
      });
    });
  </script>
</body>
</html>
