<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVCE ATTENDANCE - Login</title>
    <link rel="stylesheet" href="static/style.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body.login-page{min-height:100vh;display:flex;background:#fff;font-family:'Inter',-apple-system,sans-serif;overflow:hidden}
        .login-left{width:42%;position:relative;background:#fff;overflow:hidden}
        .blob-main{position:absolute;width:340px;height:340px;background:linear-gradient(135deg,#f953c6 0%,#b91d73 40%,#ee0979 70%,#f953c6 100%);border-radius:60% 40% 30% 70%/60% 30% 70% 40%;top:-40px;left:-60px;animation:morphBlob 8s ease-in-out infinite;box-shadow:0 20px 60px rgba(249,83,198,0.35)}
        .blob-main::after{content:'';position:absolute;inset:28px;background:rgba(255,255,255,0.22);border-radius:50% 40% 55% 35%/45% 55% 35% 55%;animation:morphBlob 8s ease-in-out infinite reverse}
        .blob-small{position:absolute;width:180px;height:180px;background:linear-gradient(135deg,#f7971e 0%,#ffd200 50%,#f953c6 100%);border-radius:40% 60% 70% 30%/50% 30% 70% 50%;bottom:-30px;left:10px;animation:morphBlob2 10s ease-in-out infinite;box-shadow:0 10px 40px rgba(247,151,30,0.35)}
        .blob-dot{position:absolute;width:70px;height:70px;background:linear-gradient(135deg,#f953c6,#b91d73);border-radius:50%;bottom:18%;right:-20px;opacity:.5}
        @keyframes morphBlob{0%,100%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%}25%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%}50%{border-radius:50% 60% 30% 60%/30% 60% 70% 40%}75%{border-radius:40% 70% 60% 30%/50% 40% 50% 60%}}
        @keyframes morphBlob2{0%,100%{border-radius:40% 60% 70% 30%/50% 30% 70% 50%}50%{border-radius:70% 30% 40% 60%/30% 60% 40% 70%}}
        .login-right{width:58%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 80px;background:#fff}
        .login-form-wrap{width:100%;max-width:360px}
        .login-college-brand{text-align:center;margin-bottom:8px}
        .login-college-brand p{font-size:11.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#b0b8c8;margin-bottom:4px}
        .login-title{font-size:28px;font-weight:700;color:#1a1a2e;text-align:center;margin-bottom:36px;letter-spacing:-0.3px}
        .login-field{display:flex;align-items:center;background:#f3f4f6;border-radius:50px;padding:0 20px;margin-bottom:18px;height:52px;border:1.5px solid transparent;transition:border-color .2s,box-shadow .2s}
        .login-field:focus-within{border-color:#f953c6;box-shadow:0 0 0 3px rgba(249,83,198,.12);background:#fff}
        .login-field svg{flex-shrink:0;color:#b0b8c8;margin-right:12px}
        .login-field input{border:none;background:transparent;flex:1;font-size:14.5px;color:#1a1a2e;outline:none;font-family:inherit}
        .login-field input::placeholder{color:#b0b8c8}
        .btn-login-new{width:100%;height:52px;border:none;border-radius:50px;background:linear-gradient(90deg,#f7971e 0%,#f953c6 50%,#b91d73 100%);color:#fff;font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:10px;transition:all .3s;box-shadow:0 8px 24px rgba(249,83,198,.4)}
        .btn-login-new:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(249,83,198,.5)}
        .login-msg{text-align:center;font-size:13px;margin-top:14px;min-height:18px;font-weight:500;color:#e53e3e}
        .login-footer-dev{text-align:center;margin-top:40px;font-size:11.5px;color:#c0c8d4}
        .login-footer-dev strong{color:#f953c6;font-weight:600}
        @media(max-width:700px){body.login-page{flex-direction:column}.login-left{width:100%;height:200px}.login-right{width:100%;padding:36px 24px}.blob-main{width:200px;height:200px;top:-20px;left:-30px}.blob-small{width:110px;height:110px}}
    </style>
</head>
<body class="login-page">
    <div class="login-left">
        <div class="blob-main"></div>
        <div class="blob-small"></div>
        <div class="blob-dot"></div>
    </div>
    <div class="login-right">
        <div class="login-form-wrap">
            <div class="login-college-brand">
                <p>Annai Vailankanni College of Engineering</p>
            </div>
            <h1 class="login-title">Staff Login</h1>
            <form id="loginForm">
                <div class="login-field">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" id="username" placeholder="Username" required autocomplete="username">
                </div>
                <div class="login-field">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login-new">LOGIN</button>
                <p id="loginMsg" class="login-msg"></p>
            </form>
            <div class="login-footer-dev">
                &copy; 2026 AVCE &bull; Developed by <strong>Saravanan K</strong>
            </div>
        </div>
    </div>
    <script src="static/app.js"></script>
    <script>
        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const msg = document.getElementById('loginMsg');
            const user = AVCE.login(u, p);
            if (user) {
                window.location.href = 'dashboard.html';
            } else {
                msg.textContent = 'Invalid username or password';
                msg.style.color = '#e53e3e';
            }
        });
    </script>
</body>
</html>
