<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Students | AVCE Attendance</title>
  <meta name="description" content="Add, manage and view students across CSE, AIDS, BME, MECH departments">
  <meta name="theme-color" content="#4F6EF7">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* ── Speed-Dial FAB ─────────────────────────────── */
    .fab-wrap { position: fixed; right: 20px;
      bottom: calc(var(--bottom-nav-h) + var(--safe-bottom) + 20px);
      z-index: 250; display: flex; flex-direction: column;
      align-items: flex-end; gap: 12px;
    }
    .fab-menu { display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
      transition: all var(--dur-base) var(--ease-spring);
      transform-origin: bottom right;
    }
    .fab-menu.hidden { pointer-events:none; opacity:0; transform:scale(0.7) translateY(20px); }
    .fab-menu-item {
      display: flex; align-items: center; gap: 10px;
      animation: fabEnter 0.3s var(--ease-spring) both;
    }
    .fab-menu-item:nth-child(1){ animation-delay:0.05s; }
    .fab-menu-item:nth-child(2){ animation-delay:0.10s; }
    .fab-menu-item:nth-child(3){ animation-delay:0.15s; }
    .fab-menu-label {
      background: var(--surface); color: var(--text-1); font-size:13px;
      font-weight: 700; padding: 6px 14px; border-radius: var(--radius-full);
      box-shadow: var(--shadow); border: 1px solid var(--border-soft);
      white-space: nowrap;
    }
    .fab-mini {
      width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: white; box-shadow: var(--shadow);
      transition: transform var(--dur-fast) var(--ease-spring);
      flex-shrink: 0;
    }
    .fab-mini:active { transform: scale(0.88); }
    .fab-mini svg { stroke: white; fill: none; stroke-width: 2.2;
      stroke-linecap: round; stroke-linejoin: round; }
    .fab-mini.add-one   { background: linear-gradient(135deg,#16C784,#0DAD6E); }
    .fab-mini.add-bulk  { background: linear-gradient(135deg,var(--primary),var(--accent)); }
    .fab-main {
      width: 58px; height: 58px; border-radius: 50%; border: none; cursor: pointer;
      background: linear-gradient(135deg,var(--primary),var(--accent));
      color: white; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 24px var(--primary-glow), 0 2px 8px rgba(0,0,0,0.18);
      transition: all var(--dur-fast) var(--ease-spring);
      -webkit-user-select: none; user-select: none;
      animation: fabEnter var(--dur-slow) var(--ease-spring) 0.3s both;
    }
    .fab-main svg { stroke: white; fill: none; stroke-width: 2.2;
      stroke-linecap: round; stroke-linejoin: round;
      transition: transform var(--dur-base) var(--ease-spring);
    }
    .fab-main.open svg { transform: rotate(45deg); }
    .fab-main:active { transform: scale(0.88); }

    /* ── Overlay backdrop for FAB menu ─────────────── */
    .fab-backdrop { position:fixed; inset:0; z-index:240; display:none; }
    .fab-backdrop.show { display:block; }

    /* ── Bulk modal enhancements ─────────────────── */
    .dept-tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:16px;
      padding-bottom:4px; -webkit-overflow-scrolling:touch; }
    .dept-tabs::-webkit-scrollbar { display:none; }
    .dept-tab { flex:0 0 auto; padding:7px 16px; border-radius:var(--radius-full);
      font-size:12.5px; font-weight:700; border:2px solid var(--border-soft);
      background:var(--surface-2); color:var(--text-2); cursor:pointer;
      transition:all var(--dur-fast) var(--ease-smooth);
      -webkit-user-select:none; user-select:none;
    }
    .dept-tab:active { transform:scale(0.94); }
    .dept-tab.active-cse  { background:#EEF2FF; border-color:var(--cse);  color:var(--cse); }
    .dept-tab.active-aids { background:#EDFBF4; border-color:var(--aids); color:var(--aids); }
    .dept-tab.active-bme  { background:#F3EFFE; border-color:var(--bme);  color:var(--bme); }
    .dept-tab.active-mech { background:#FFF8EC; border-color:var(--mech); color:var(--mech); }

    /* ── Live name rows ──────────────────────────── */
    .names-list { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
    .name-row { display:flex; align-items:center; gap:8px; }
    .row-num  { font-size:11px; font-weight:700; color:var(--text-3);
      width:22px; text-align:right; flex-shrink:0; }
    .name-input {
      flex:1; height:40px; padding:0 12px;
      background:var(--surface-2); border:1.5px solid var(--border-soft);
      border-radius:var(--radius-sm); color:var(--text-1); font-size:13.5px;
      outline:none; transition:border-color var(--dur-fast);
    }
    .name-input:focus { border-color:var(--primary); background:var(--surface); }
    .name-input::placeholder { color:var(--text-3); }
    .del-row-btn { width:32px; height:32px; border-radius:9px; border:none;
      background:var(--danger-bg); color:var(--danger); cursor:pointer;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
      transition:all var(--dur-fast) var(--ease-spring);
    }
    .del-row-btn:active { transform:scale(0.86); }
    .del-row-btn svg { stroke:currentColor; fill:none; stroke-width:2;
      stroke-linecap:round; stroke-linejoin:round; }

    /* ── Add-row / paste bar ─────────────────────── */
    .add-row-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }

    /* ── Paste preview ───────────────────────────── */
    .paste-count-badge {
      display:inline-flex; align-items:center; gap:5px;
      font-size:12px; font-weight:700; color:var(--primary);
      background:var(--primary-light); padding:4px 12px;
      border-radius:var(--radius-full); margin-bottom:12px;
    }
    /* ── Progress bar ────────────────────────────── */
    .save-progress { height:4px; background:var(--border-soft);
      border-radius:var(--radius-full); overflow:hidden; margin-top:10px; }
    .save-progress-bar { height:100%; background:linear-gradient(90deg,var(--primary),var(--accent));
      border-radius:var(--radius-full); width:0%;
      transition:width 0.4s var(--ease-smooth); }
  </style>
</head>

<body>
<div class="app-shell">

  <!-- ── MOBILE HEADER ── -->
  <header class="mobile-header">
    <div class="mobile-header-brand">
      <div class="header-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <div>
        <div class="header-title">Students</div>
        <div class="header-subtitle"><span id="studentCount">0</span> total enrolled</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn theme-toggle-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="icon-btn" onclick="exportStudentsCSV()" title="Export CSV">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── PAGE CONTENT ── -->
  <main class="page-content">

    <!-- Animated Illustrator -->
    <div style="display:flex;justify-content:center;margin-bottom:8px;">
      <svg width="220" height="90" viewBox="0 0 220 90" fill="none">
        <rect x="10" y="72" width="200" height="5" rx="2.5" fill="var(--primary-light)" opacity="0.8"/>
        <g transform="translate(18,28)" style="animation:floatDot 3s ease-in-out infinite 0s;">
          <circle cx="20" cy="10" r="10" fill="#4F6EF7" opacity="0.9"/>
          <text x="20" y="14" text-anchor="middle" fill="white" font-size="10" font-weight="bold" font-family="Inter,sans-serif">S</text>
          <rect x="8" y="22" width="24" height="18" rx="4" fill="#4F6EF7" opacity="0.7"/>
        </g>
        <g transform="translate(68,28)" style="animation:floatDot 3.5s ease-in-out infinite 0.3s;">
          <circle cx="20" cy="10" r="10" fill="#16C784" opacity="0.9"/>
          <text x="20" y="14" text-anchor="middle" fill="white" font-size="10" font-weight="bold" font-family="Inter,sans-serif">A</text>
          <rect x="8" y="22" width="24" height="18" rx="4" fill="#16C784" opacity="0.7"/>
        </g>
        <g transform="translate(118,28)" style="animation:floatDot 3.2s ease-in-out infinite 0.6s;">
          <circle cx="20" cy="10" r="10" fill="#7C5CFC" opacity="0.9"/>
          <text x="20" y="14" text-anchor="middle" fill="white" font-size="10" font-weight="bold" font-family="Inter,sans-serif">B</text>
          <rect x="8" y="22" width="24" height="18" rx="4" fill="#7C5CFC" opacity="0.7"/>
        </g>
        <g transform="translate(168,28)" style="animation:floatDot 3.8s ease-in-out infinite 0.9s;">
          <circle cx="20" cy="10" r="10" fill="#FFA621" opacity="0.9"/>
          <text x="20" y="14" text-anchor="middle" fill="white" font-size="10" font-weight="bold" font-family="Inter,sans-serif">M</text>
          <rect x="8" y="22" width="24" height="18" rx="4" fill="#FFA621" opacity="0.7"/>
        </g>
        <circle cx="8"   cy="20" r="2.5" fill="#FFA621" opacity="0.6" class="float-dot"/>
        <circle cx="212" cy="18" r="2"   fill="#4F6EF7" opacity="0.5" class="float-dot"/>
        <circle cx="112" cy="8"  r="2"   fill="#16C784" opacity="0.6" class="float-dot"/>
      </svg>
    </div>

    <!-- ── FILTER CHIPS ── -->
    <div class="filter-chips-wrap">
      <button class="chip active" data-dept="" onclick="filterByDepartment('',this)">All</button>
      <button class="chip" data-dept="1" onclick="filterByDepartment('1',this)">
        CSE <span class="chip-count" id="chip-count-1">0</span>
      </button>
      <button class="chip" data-dept="2" onclick="filterByDepartment('2',this)">
        AIDS <span class="chip-count" id="chip-count-2">0</span>
      </button>
      <button class="chip" data-dept="3" onclick="filterByDepartment('3',this)">
        BME <span class="chip-count" id="chip-count-3">0</span>
      </button>
      <button class="chip" data-dept="4" onclick="filterByDepartment('4',this)">
        MECH <span class="chip-count" id="chip-count-4">0</span>
      </button>
    </div>

    <!-- ── SEARCH ── -->
    <div class="search-wrap">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" id="studentSearch" class="search-input"
        placeholder="Search name, roll code or dept…"
        oninput="searchStudents()" autocomplete="off">
    </div>

    <!-- ── STUDENT LIST ── -->
    <div class="student-list" id="studentList">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

  </main>

  <!-- ── SPEED-DIAL FAB ── -->
  <div class="fab-backdrop" id="fabBackdrop" onclick="closeFabMenu()"></div>

  <div class="fab-wrap">
    <!-- Speed-dial items (hidden by default) -->
    <div class="fab-menu hidden" id="fabMenu">

      <div class="fab-menu-item">
        <span class="fab-menu-label">Add One Student</span>
        <button class="fab-mini add-one" onclick="closeFabMenu(); openStudentModal();" title="Add one student">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </div>

      <div class="fab-menu-item">
        <span class="fab-menu-label">Bulk Add — Paste Names</span>
        <button class="fab-mini add-bulk" onclick="closeFabMenu(); openBulkStudentModal();" title="Bulk add students">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- Main FAB button -->
    <button class="fab-main" id="fabMain" onclick="toggleFabMenu()" aria-label="Add students">
      <svg width="26" height="26" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </div>

  <!-- ── BOTTOM NAV ── -->
  <nav class="bottom-nav">
    <a class="nav-item" href="/dashboard" data-page="dashboard">
      <div class="nav-icon-wrap">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </div>
      <span class="nav-label">Dashboard</span>
    </a>
    <a class="nav-item active" href="/students" data-page="students">
      <div class="nav-icon-wrap">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <span class="nav-label">Students</span>
    </a>
    <a class="nav-item" href="/attendance" data-page="attendance">
      <div class="nav-icon-wrap">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <span class="nav-label">Attendance</span>
    </a>
    <button class="nav-item" onclick="logout()" data-page="logout">
      <div class="nav-icon-wrap">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
      <span class="nav-label">Logout</span>
    </button>
  </nav>

</div>


<!-- ══════════════════════════════════════════════════════
     BOTTOM SHEET: Add Single Student
══════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="studentModal">
  <div class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Add One Student
      </div>
      <button class="sheet-close" onclick="closeStudentModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <form id="studentForm">
      <div class="form-group">
        <label>Department *</label>
        <select id="departmentId" required onchange="autoGenerateStudentCode()">
          <option value="1">Computer Science &amp; Engineering (CSE)</option>
          <option value="2">Artificial Intelligence &amp; Data Science (AIDS)</option>
          <option value="3">Biomedical Engineering (BME)</option>
          <option value="4">Mechanical Engineering (MECH)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Roll Code / Student Code *</label>
        <input type="text" id="studentCode" placeholder="e.g. CSE001" required autocomplete="off">
      </div>
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="studentName" placeholder="e.g. Arun Kumar" required autocomplete="off">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Gender</label>
          <select id="studentGender">
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Year</label>
          <select id="studentYear">
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Section</label>
        <input type="text" id="studentSection" value="A" placeholder="A / B / C" maxlength="3">
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:4px;">
        Save Student
      </button>
    </form>
  </div>
</div>


<!-- ══════════════════════════════════════════════════════
     BOTTOM SHEET: BULK ADD (Enhanced)
══════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="bulkStudentModal">
  <div class="bottom-sheet" style="padding-left:16px;padding-right:16px;">
    <div class="sheet-handle"></div>

    <div class="sheet-header">
      <div class="sheet-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6"  x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6"  x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        Bulk Add Students
      </div>
      <button class="sheet-close" onclick="closeBulkStudentModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Step 1: Department tabs -->
    <p style="font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">
      1. Select Department
    </p>
    <div class="dept-tabs">
      <button class="dept-tab active-cse" data-dept-id="1" data-dept-cls="cse" onclick="selectBulkDept(1,'cse',this)">
        🖥️ CSE
      </button>
      <button class="dept-tab" data-dept-id="2" data-dept-cls="aids" onclick="selectBulkDept(2,'aids',this)">
        🤖 AIDS
      </button>
      <button class="dept-tab" data-dept-id="3" data-dept-cls="bme" onclick="selectBulkDept(3,'bme',this)">
        🧬 BME
      </button>
      <button class="dept-tab" data-dept-id="4" data-dept-cls="mech" onclick="selectBulkDept(4,'mech',this)">
        ⚙️ MECH
      </button>
    </div>

    <!-- Step 2: Year & Section -->
    <p style="font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">
      2. Year &amp; Section
    </p>
    <div class="form-row" style="margin-bottom:16px;">
      <div class="form-group" style="margin:0;">
        <select id="bulkYear" style="height:42px;padding:0 12px;background:var(--surface-2);border:1.5px solid var(--border-soft);border-radius:var(--radius-sm);color:var(--text-1);font-size:13.5px;width:100%;outline:none;appearance:none;">
          <option value="1">1st Year</option>
          <option value="2">2nd Year</option>
          <option value="3">3rd Year</option>
          <option value="4">4th Year</option>
        </select>
      </div>
      <div class="form-group" style="margin:0;">
        <input type="text" id="bulkSection" value="A" placeholder="Section (A/B/C)" maxlength="3"
          style="height:42px;padding:0 12px;background:var(--surface-2);border:1.5px solid var(--border-soft);border-radius:var(--radius-sm);color:var(--text-1);font-size:13.5px;width:100%;outline:none;text-transform:uppercase;">
      </div>
    </div>

    <!-- Step 3: Names -->
    <p style="font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">
      3. Student Names
    </p>

    <!-- Paste from Excel button -->
    <div class="add-row-bar">
      <button class="btn btn-secondary btn-sm" onclick="addBulkRow()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add Row
      </button>
      <button class="btn btn-secondary btn-sm" onclick="addBulkRows(5)">+5 Rows</button>
      <button class="btn btn-secondary btn-sm" onclick="addBulkRows(10)">+10 Rows</button>
      <button class="btn btn-secondary btn-sm" onclick="pasteFromClipboard()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
        </svg>
        Paste Names
      </button>
      <button class="btn btn-danger btn-sm" onclick="clearAllBulkRows()">Clear All</button>
    </div>

    <!-- Name count badge -->
    <div id="pasteCountBadge" class="paste-count-badge" style="display:none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span id="pasteCountText">0 names ready</span>
    </div>

    <!-- Dynamic name rows -->
    <div class="names-list" id="bulkNamesList"></div>

    <!-- Tip -->
    <p style="font-size:11.5px;color:var(--text-3);margin-bottom:16px;line-height:1.6;">
      💡 Tip: Copy names from Excel (one column) and tap <strong>Paste Names</strong> to fill all rows instantly.
    </p>

    <!-- Save button -->
    <button class="btn btn-primary btn-full btn-lg" id="bulkSaveBtn" onclick="handleBulkAddStudents()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
        <line x1="19" y1="8" x2="19" y2="14"/>
        <line x1="16" y1="11" x2="22" y2="11"/>
      </svg>
      Add All Students
    </button>
    <div class="save-progress" style="display:none;" id="saveProgressWrap">
      <div class="save-progress-bar" id="saveProgressBar"></div>
    </div>

  </div>
</div>


<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>
/* ── Bulk dept selection ─────────────────────────── */
let _bulkDeptId  = 1;
let _bulkDeptCls = 'cse';

function selectBulkDept(id, cls, btn) {
  _bulkDeptId  = id;
  _bulkDeptCls = cls;
  document.querySelectorAll('.dept-tab').forEach(t => {
    t.className = 'dept-tab';
  });
  btn.classList.add(`active-${cls}`);
  AVCE.vibrate(30);
  updateNameCount();
}

/* ── Row management ─────────────────────────────── */
let _rowCount = 0;

function addBulkRow(value) {
  _rowCount++;
  const list = document.getElementById('bulkNamesList');
  const row  = document.createElement('div');
  row.className = 'name-row';
  row.dataset.rowId = _rowCount;
  row.innerHTML = `
    <span class="row-num">${_rowCount}</span>
    <input class="name-input bulk-name" type="text"
      placeholder="Student name ${_rowCount}"
      value="${AVCE.esc(value || '')}"
      oninput="updateNameCount()"
      autocomplete="off"
      autocapitalize="words">
    <button class="del-row-btn" onclick="deleteBulkRow(this)" title="Remove row">
      <svg width="13" height="13" viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>`;
  list.appendChild(row);
  updateNameCount();
  // Focus newly added row
  if (!value) {
    setTimeout(() => row.querySelector('.bulk-name').focus(), 60);
  }
}

function addBulkRows(n) {
  for (let i = 0; i < n; i++) addBulkRow('');
  AVCE.vibrate(30);
}

function deleteBulkRow(btn) {
  btn.closest('.name-row').remove();
  renumberRows();
  updateNameCount();
  AVCE.vibrate(20);
}

function renumberRows() {
  document.querySelectorAll('#bulkNamesList .name-row').forEach((r, i) => {
    r.querySelector('.row-num').textContent = i + 1;
  });
}

function clearAllBulkRows() {
  if (!confirm('Clear all rows?')) return;
  document.getElementById('bulkNamesList').innerHTML = '';
  _rowCount = 0;
  updateNameCount();
}

function updateNameCount() {
  const inputs = document.querySelectorAll('#bulkNamesList .bulk-name');
  const filled = Array.from(inputs).filter(i => i.value.trim()).length;
  const badge  = document.getElementById('pasteCountBadge');
  const text   = document.getElementById('pasteCountText');
  if (filled > 0) {
    badge.style.display = 'inline-flex';
    text.textContent = `${filled} name${filled !== 1 ? 's' : ''} ready to add`;
  } else {
    badge.style.display = 'none';
  }
}

/* ── Paste from clipboard ───────────────────────── */
async function pasteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    const names = text.split(/\r?\n/).map(n => n.trim()).filter(Boolean);
    if (!names.length) { AVCE.showToast('Clipboard is empty', 'warning'); return; }

    // Clear existing rows and fill with pasted names
    document.getElementById('bulkNamesList').innerHTML = '';
    _rowCount = 0;
    names.forEach(name => addBulkRow(name));
    updateNameCount();
    AVCE.showToast(`✓ Pasted ${names.length} names!`, 'success');
    AVCE.vibrate(60);
  } catch (err) {
    // Fallback: show textarea prompt
    const raw = prompt('Paste student names here (one per line):');
    if (!raw) return;
    const names = raw.split('\n').map(n => n.trim()).filter(Boolean);
    document.getElementById('bulkNamesList').innerHTML = '';
    _rowCount = 0;
    names.forEach(name => addBulkRow(name));
    updateNameCount();
    AVCE.showToast(`✓ Loaded ${names.length} names!`, 'success');
  }
}

/* ── Bulk save (calls Flask API) ───────────────── */
function handleBulkAddStudents() {
  const inputs = Array.from(document.querySelectorAll('#bulkNamesList .bulk-name'));
  const names  = inputs.map(i => i.value.trim()).filter(Boolean);

  if (!names.length) {
    AVCE.showToast('Enter at least one student name.', 'error');
    AVCE.vibrate([50,30,50]);
    return;
  }

  const year    = document.getElementById('bulkYear')?.value || 1;
  const section = (document.getElementById('bulkSection')?.value || 'A').toUpperCase();

  const btn  = document.getElementById('bulkSaveBtn');
  const prog = document.getElementById('saveProgressWrap');
  const bar  = document.getElementById('saveProgressBar');

  btn.disabled = true;
  btn.textContent = `Adding ${names.length} students…`;
  if (prog) prog.style.display = 'block';

  // Animated progress bar
  let done = 0;
  const interval = setInterval(() => {
    done += Math.ceil(names.length / 10);
    const pct = Math.min(Math.round((done / names.length) * 100), 90);
    if (bar) bar.style.width = pct + '%';
  }, 60);

  fetch('/api/students/bulk', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      department_id: _bulkDeptId,
      year: parseInt(year),
      section,
      names
    })
  })
    .then(r => r.json())
    .then(result => {
      clearInterval(interval);
      if (bar) bar.style.width = '100%';
      setTimeout(() => {
        if (result.success) {
          AVCE.showToast(`✓ ${result.count} students added to ${AVCE.deptCode(_bulkDeptId)}!`, 'success');
          AVCE.vibrate(80);
          closeBulkStudentModal();
          loadStudents();
        } else {
          AVCE.showToast(result.message || 'Failed to add students.', 'error');
          btn.disabled = false;
          btn.textContent = 'Add All Students';
          if (prog) prog.style.display = 'none';
        }
      }, 350);
    })
    .catch(() => {
      clearInterval(interval);
      AVCE.showToast('Network error. Please try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Add All Students';
      if (bar) bar.style.width = '0%';
      if (prog) prog.style.display = 'none';
    });
}

/* ── FAB speed-dial ─────────────────────────────── */
let _fabOpen = false;
function toggleFabMenu() {
  _fabOpen = !_fabOpen;
  document.getElementById('fabMenu').classList.toggle('hidden', !_fabOpen);
  document.getElementById('fabMain').classList.toggle('open', _fabOpen);
  document.getElementById('fabBackdrop').classList.toggle('show', _fabOpen);
  AVCE.vibrate(30);
}
function closeFabMenu() {
  _fabOpen = false;
  document.getElementById('fabMenu').classList.add('hidden');
  document.getElementById('fabMain').classList.remove('open');
  document.getElementById('fabBackdrop').classList.remove('show');
}

/* ── Modal overrides to init bulk rows ─────────── */
function openBulkStudentModal() {
  const overlay = document.getElementById('bulkStudentModal');
  if (!overlay) return;
  overlay.style.display = 'flex';
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  AVCE.vibrate(30);

  // Pre-fill 5 empty rows if list is empty
  const list = document.getElementById('bulkNamesList');
  if (!list.children.length) addBulkRows(5);
}

/* ── chip counts ─────────────────────────────────── */
function updateChipCounts() {
  const all = AVCE.getStudents();
  [1,2,3,4].forEach(id => {
    const el = document.getElementById(`chip-count-${id}`);
    if (el) el.textContent = all.filter(s => s.department_id === id).length;
  });
}

/* ── Patch renderStudentList to also update chips ── */
document.addEventListener('DOMContentLoaded', function() {
  const origRender = window.renderStudentList;
  window.renderStudentList = function() {
    origRender && origRender();
    updateChipCounts();
  };
  updateChipCounts();
});
</script>
</body>
</html>
