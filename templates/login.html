<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVCE ATTENDANCE - Login</title>
    <meta name="description" content="Staff and Admin login for AVCE Attendance Management System">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">

    <!-- Ambient Orbs -->
    <div class="ambient-mesh">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>

    <!-- Background Watermark -->
    <div class="login-bg-watermark" aria-hidden="true">AVCE ATTENDANCE</div>

    <div class="login-container">

        <!-- College Branding -->
        <div class="login-header-brand">
            <div class="college-icon-wrap">
                <!-- Graduation Cap SVG -->
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
            <h1 class="brand-title">AVCE ATTENDANCE</h1>
            <p class="brand-tagline">Annai Vailankanni College of Engineering</p>
        </div>

        <!-- Login Card -->
        <div class="login-box">
            <h2>Staff &amp; Admin Login</h2>
            <p class="login-subtitle">Sign in to manage student attendance</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    Sign In
                </button>

                <p id="loginMessage" class="message"></p>

            </form>
        </div>

        <!-- Footer -->
        <footer class="login-footer">
            <p>&copy; 2026 AVCE &bull; Developed by <strong>Saravanan K</strong> (Developer)</p>
        </footer>

    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
