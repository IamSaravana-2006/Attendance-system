<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | AVCE Attendance</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="ambient-mesh"><div class="ambient-orb orb-1"></div><div class="ambient-orb orb-2"></div><div class="ambient-orb orb-3"></div></div>
<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="sidebar-brand-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg></div>
        <div class="sidebar-brand-text">AVCE<small>Attendance System</small></div>
    </div>
    <div class="nav-label">Navigation</div>
    <nav>
        <a href="dashboard.html"><span class="nav-icon icon-svg"><svg width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span><span>Dashboard</span></a>
        <a href="students.html"><span class="nav-icon icon-svg"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span>Students</span></a>
        <a href="attendance.html" class="active"><span class="nav-icon icon-svg"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span><span>Attendance</span></a>
        <a href="#" onclick="logout()"><span class="nav-icon icon-svg"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span>Logout</span></a>
    </nav>
    <div class="sidebar-footer-brand">AVCE ATTENDANCE<strong>Saravanan K</strong></div>
</aside>

<!-- MAIN -->
<main class="main">
    <header class="topbar">
        <div><h1>Attendance</h1><p>Mark &amp; manage class attendance in real-time</p></div>
        <div class="topbar-right">
            <button class="theme-toggle-btn" onclick="toggleTheme()"></button>
            <button class="btn btn-secondary" onclick="exportAttCSV()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export CSV</button>
        </div>
    </header>

    <!-- Live Stats -->
    <div class="attendance-live-stats">
        <div class="live-stat-card total"><span>Total</span><strong id="ls_total">0</strong></div>
        <div class="live-stat-card present"><span>Present</span><strong id="ls_present">0</strong></div>
        <div class="live-stat-card absent"><span>Absent</span><strong id="ls_absent">0</strong></div>
        <div class="live-stat-card late"><span>Late</span><strong id="ls_late">0</strong></div>
        <div class="live-stat-card rate"><span>Rate</span><strong id="ls_rate">0%</strong></div>
    </div>

    <!-- Controls -->
    <div class="attendance-controls">
        <div class="control-item">
            <label>Branch:</label>
            <select id="attDept" onchange="loadAttendance()">
                <option value="0">All 4 Departments</option>
                <option value="1">CSE - Computer Science</option>
                <option value="2">AIDS - AI &amp; Data Science</option>
                <option value="3">BME - Biomedical Engineering</option>
                <option value="4">MECH - Mechanical Engineering</option>
            </select>
        </div>
        <div class="control-item">
            <label>Date:</label>
            <input type="date" id="attDate" onchange="loadAttendance()">
        </div>
        <button class="btn btn-secondary" onclick="loadAttendance()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Refresh</button>
        <div class="attendance-quick-buttons">
            <button class="btn btn-outline-warning" onclick="toggleAbsentees()" id="absenteeBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg> Show Absentees Only</button>
            <button class="btn btn-success" onclick="markAllPresent()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Mark All Present</button>
            <button class="btn btn-primary" onclick="saveAll()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save All</button>
        </div>
    </div>

    <!-- Table -->
    <div class="table-container">
        <table>
            <thead><tr><th>Roll Code</th><th>Student Name</th><th>Department</th><th>Status</th><th>Check In</th><th>Remarks</th><th>Save</th></tr></thead>
            <tbody id="attBody"></tbody>
        </table>
    </div>

    <footer class="app-footer"><p>&copy; 2026 AVCE ATTENDANCE &bull; Developed by <strong>Saravanan K</strong></p></footer>
</main>
</div>

<script src="static/app.js"></script>
<script>
    AVCE.requireLogin();
    AVCE.initTheme();

    let showAbsenteesOnly = false;
    let currentRows = [];

    // Set today's date
    document.getElementById('attDate').value = AVCE.getToday();

    function loadAttendance() {
        const date = document.getElementById('attDate').value || AVCE.getToday();
        const deptId = parseInt(document.getElementById('attDept').value) || 0;
        currentRows = AVCE.getAttendanceForDate(date, deptId);
        renderTable();
        updateLiveStats();
    }

    function renderTable() {
        const tbody = document.getElementById('attBody');
        let rows = currentRows;
        if (showAbsenteesOnly) rows = rows.filter(r => r.status === 'Absent' || r.status === 'Late');
        if (!rows.length) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted)">${currentRows.length ? 'No absentees found!' : 'No students in this department. Add students first.'}</td></tr>`;
            return;
        }
        const dc = r => AVCE.deptClass(r.department_id);
        tbody.innerHTML = rows.map(r => `
            <tr data-id="${r.id}">
                <td><span class="code-badge">${AVCE.esc(r.student_code)}</span></td>
                <td><strong>${AVCE.esc(r.name)}</strong><div style="font-size:11px;color:var(--text-muted)">Year ${r.year} · Sec ${AVCE.esc(r.section)}</div></td>
                <td><span class="dept-badge dept-badge-${dc(r)}">${AVCE.deptCode(r.department_id)}</span></td>
                <td>
                    <select class="attendance-select" id="st_${r.id}" onchange="updateLiveStats()">
                        <option value="Present" ${r.status==='Present'?'selected':''}>Present</option>
                        <option value="Absent"  ${r.status==='Absent' ?'selected':''}>Absent</option>
                        <option value="Late"    ${r.status==='Late'   ?'selected':''}>Late</option>
                        <option value="Leave"   ${r.status==='Leave'  ?'selected':''}>Leave</option>
                    </select>
                </td>
                <td><input type="time" class="time-input" id="ci_${r.id}" value="${AVCE.esc(r.check_in)}"></td>
                <td><input type="text" class="remarks-input" id="rm_${r.id}" value="${AVCE.esc(r.remarks)}" placeholder="Remarks"></td>
                <td>
                    <button class="btn btn-primary btn-sm" onclick="saveOne(${r.id})">Save</button>
                </td>
            </tr>`).join('');
    }

    function updateLiveStats() {
        const rows = currentRows;
        let p=0,ab=0,l=0;
        rows.forEach(r => {
            const el = document.getElementById(`st_${r.id}`);
            const v = el ? el.value : r.status;
            if(v==='Present') p++;
            else if(v==='Late') l++;
            else ab++;
        });
        const total = rows.length;
        document.getElementById('ls_total').textContent   = total;
        document.getElementById('ls_present').textContent = p;
        document.getElementById('ls_absent').textContent  = ab;
        document.getElementById('ls_late').textContent    = l;
        document.getElementById('ls_rate').textContent    = total ? Math.round((p/total)*100)+'%' : '0%';
    }

    function saveOne(id) {
        const date = document.getElementById('attDate').value || AVCE.getToday();
        const status  = document.getElementById(`st_${id}`).value;
        const checkIn = document.getElementById(`ci_${id}`).value;
        const remarks = document.getElementById(`rm_${id}`).value;
        AVCE.saveAttendanceRecord(id, date, status, checkIn, remarks);
        AVCE.showToast('Saved!', 'success');
        // sync back to currentRows
        const row = currentRows.find(r => r.id === id);
        if (row) { row.status = status; row.check_in = checkIn; row.remarks = remarks; }
    }

    function saveAll() {
        const date = document.getElementById('attDate').value || AVCE.getToday();
        const records = currentRows.map(r => ({
            student_id: r.id,
            status:  (document.getElementById(`st_${r.id}`) || {}).value || r.status,
            check_in: (document.getElementById(`ci_${r.id}`) || {}).value || '',
            remarks:  (document.getElementById(`rm_${r.id}`) || {}).value || ''
        }));
        const res = AVCE.bulkSaveAttendance(date, records);
        AVCE.showToast(res.message, 'success');
        loadAttendance();
    }

    function markAllPresent() {
        currentRows.forEach(r => {
            const el = document.getElementById(`st_${r.id}`);
            if (el) el.value = 'Present';
        });
        updateLiveStats();
        AVCE.showToast('All marked Present — click Save All to confirm', 'info');
    }

    function toggleAbsentees() {
        showAbsenteesOnly = !showAbsenteesOnly;
        const btn = document.getElementById('absenteeBtn');
        if (showAbsenteesOnly) {
            btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Show All Students`;
            AVCE.showToast('Showing absentees only', 'info');
        } else {
            btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg> Show Absentees Only`;
            AVCE.showToast('Showing all students', 'info');
        }
        renderTable();
    }

    function exportAttCSV() {
        const date = document.getElementById('attDate').value || AVCE.getToday();
        const rows = currentRows.map(r => {
            const st = (document.getElementById(`st_${r.id}`)||{}).value || r.status;
            const ci = (document.getElementById(`ci_${r.id}`)||{}).value || r.check_in;
            const rm = (document.getElementById(`rm_${r.id}`)||{}).value || r.remarks;
            return [r.student_code, r.name, AVCE.deptCode(r.department_id), st, ci, rm, date];
        });
        AVCE.exportCSV(rows, `AVCE_Attendance_${date}.csv`, ['Roll Code','Name','Dept','Status','Check In','Remarks','Date']);
        AVCE.showToast('Attendance exported!', 'success');
    }

    loadAttendance();
</script>
</body>
</html>
